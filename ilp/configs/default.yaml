# Hyperparameters for InductiveKGModel training (spec §6)

# Model
d_model: 128
n_heads: 8
n_triple_layers: 2
n_sab: 4
dropout: 0.1

# Optimization
batch_size: 128
lr: 1.0e-4
weight_decay: 1.0e-2
warmup_steps: 1000
max_steps: 10000
grad_clip: 1.0

# Sampling
max_triples: 128
z_pool_size: 300
cardinality_cutoff: 100
neg_samples_per_pos: 4

# Data
data_dir: data/dbpedia50
triple_format: head_tail_relation   # DBpedia50 layout: h <TAB> t <TAB> r
# Schema relations: tails are always promoted to [VAL_*] regardless of
# cardinality. Accepts a string (single relation) or a list. Use this for
# rdf:type and any other relations whose range forms a class/type hierarchy.
type_relation: "rdf:type"
# Multi-relation example (e.g. for WordNet-like KGs):
# type_relation:
#   - rdf:type
#   - _hypernym
#   - _instance_hypernym

# Eval / checkpointing
val_every: 2000
run_name: default       # outputs go to checkpoints/{run_name}/
seed: 0
num_workers: 4
device: cuda
