# Inductive family demo: learn "parentOf ⟹ olderThan" and transfer it to
# brand-new families. See ilp/make_family_data.py and ilp/FAMILY_DEMO.md.
#
#   python -m ilp.make_family_data --out KGs            # generate data
#   python -m ilp.train --config ilp/configs/kg_family.yaml \
#       --save runs/kg_family.pt \
#       --test-file KGs/kg_family_ind/test.txt \
#       --obs-file  KGs/kg_family_ind/train.txt
#   python -m ilp.family_demo --model runs/kg_family.pt

d_model: 128
n_heads: 8
n_triple_layers: 2
n_sab: 4
dropout: 0.1

epochs: 40
batch_size: 128
lr: 0.0003
weight_decay: 0.01
warmup_steps: 200
grad_clip: 1.0

max_triples: 64
z_pool_size: 100
subgraph_hops: 2

# No schema entities: every PERSON is anonymized to a random [Z_*] slot, so the
# model literally cannot memorize individuals — it must learn the relation rule.
# (The "no schema" warning the vocab prints is expected and is the whole point.)
type_relation: ""
tail_diversity_cutoff: 0.0
cardinality_cutoff: 0

# Hard negatives drawn from the same family neighborhood: the wrong answer is a
# real relative (e.g. the child, a sibling, a grandparent), so getting olderThan
# right requires using the direction of parentOf — not entity type or position.
neg_sampler: two_hop
neg_samples_per_pos: 4

data_dir: KGs/kg_family
triple_format: head_relation_tail
run_name: kg_family
seed: 0
num_workers: 4
device: cuda
